[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "passe1"
version = "0.2.7"
description = "CLI do Passe1: seu passe de IA no terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
passe1 = "passe1:main"

[tool.setuptools]
py-modules = ["passe1", "agente", "sessao", "sandbox", "terminal", "processos", "arquivos_seguros"]
