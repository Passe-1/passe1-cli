name: Publicar wheels por plataforma
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: macos-15-intel
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: python scripts/build-engine.py
      - run: python -m pip install build pytest httpx
      - run: python -m build --wheel
      - run: python -m pytest tests/test_engine.py tests/test_instalador.py tests/test_login_http.py -q
      - run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',glob.glob('dist/*.whl')[0]])"
      - run: python -c "import os,subprocess,tempfile; os.chdir(tempfile.gettempdir()); import passe1_engine.launcher as l; from pathlib import Path; p=Path(l.__file__).parent/'bin'/('opencode.exe' if os.name=='nt' else 'opencode'); subprocess.check_call([str(p),'--version'])"
      - run: python scripts/smoke-engine.py
      - if: runner.os != 'Windows'
        run: python -m pip install pexpect
      - if: runner.os == 'Windows'
        run: python -m pip install pywinpty
      - run: python scripts/smoke-tui.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true
      - name: Publicar release após todos os builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: python -c "import glob,os,subprocess; wheels=glob.glob('wheels/*.whl'); assert len(wheels)==6, 'Wheels ausentes'; subprocess.check_call(['gh','release','create',os.environ['RELEASE_TAG'],*wheels,'scripts/install.py','scripts/install.sh','scripts/install.ps1','--title','Passe1 CLI '+os.environ['RELEASE_TAG'],'--generate-notes'])"
