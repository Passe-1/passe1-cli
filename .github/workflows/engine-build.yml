name: Compilar motor por plataforma
on:
  pull_request:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      partial: ${{ steps.select.outputs.partial }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: select
        run: |
          if git log -1 --format=%B | grep -Fq '[windows-only]'; then
            echo 'matrix=["windows-latest","windows-11-arm"]' >> "$GITHUB_OUTPUT"
            echo 'partial=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["macos-15","macos-15-intel","ubuntu-latest","ubuntu-24.04-arm","windows-latest","windows-11-arm"]' >> "$GITHUB_OUTPUT"
            echo 'partial=false' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.os == 'windows-11-arm' && '1.4.3' || '1.3.14' }}
      - if: runner.os == 'Windows'
        run: python -m pip install pytest
      - if: runner.os == 'Windows'
        run: python -m pytest tests/test_win_secure.py tests/test_win_private.py tests/test_win_image_adapter.py tests/test_win_move.py tests/test_secure_stream.py -q
      - run: python scripts/build-engine.py
      - run: python -m pip install build pytest httpx
      - run: python -m build --wheel
      - run: python -m pytest tests/test_engine.py tests/test_instalador.py tests/test_login_http.py tests/test_secure_stream.py tests/test_secure_write.py tests/test_secure_search.py tests/test_fetch_rg.py tests/test_quarentena.py tests/test_secure_move.py -q
      - id: installed_wheel
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',glob.glob('dist/*.whl')[0]])"
      - run: python -c "import os,subprocess,tempfile; os.chdir(tempfile.gettempdir()); import passe1_engine.launcher as l; from pathlib import Path; p=Path(l.__file__).parent/'bin'/('opencode.exe' if os.name=='nt' else 'opencode'); subprocess.check_call([str(p),'--version'])"
      - if: runner.os == 'Windows'
        run: python scripts/smoke-windows-exec.py
      - run: python scripts/smoke-engine.py
      - run: python scripts/smoke-secure-grep.py
      - run: python scripts/smoke-image-integrity.py
      - run: python scripts/smoke-legacy.py
      - id: pexpect_ready
        if: ${{ !cancelled() && runner.os != 'Windows' && steps.installed_wheel.outcome == 'success' }}
        run: python -m pip install pexpect
      - id: winpty_ready
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.installed_wheel.outcome == 'success' }}
        run: python -m pip install pywinpty
      - if: ${{ !cancelled() && runner.os != 'Windows' && steps.pexpect_ready.outcome == 'success' }}
        env:
          PASSE1_TEST_INSTALLED: '1'
        run: python -m pytest tests/test_recover_move_cli.py -q
      - if: ${{ !cancelled() && runner.os != 'Windows' && steps.pexpect_ready.outcome == 'success' }}
        run: python scripts/smoke-move-recovery.py
      - if: ${{ !cancelled() && runner.os != 'Windows' && steps.pexpect_ready.outcome == 'success' }}
        run: python scripts/smoke-move-new-destination.py
      - if: ${{ !cancelled() && runner.os == 'Windows' && steps.winpty_ready.outcome == 'success' }}
        run: python -m pytest tests/test_recuperacao_wheel.py -q
      - if: ${{ !cancelled() && runner.os == 'Windows' && steps.winpty_ready.outcome == 'success' }}
        run: python -m pytest tests/test_win_move_wheel.py -q
      - if: ${{ !cancelled() && runner.os == 'Windows' && steps.winpty_ready.outcome == 'success' }}
        run: python -m pytest tests/test_win_image_wheel.py -q
      - if: ${{ !cancelled() && (steps.pexpect_ready.outcome == 'success' || steps.winpty_ready.outcome == 'success') }}
        run: python scripts/smoke-tui.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  full-matrix-gate:
    if: always()
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir a matriz completa e verde
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PARTIAL: ${{ needs.plan.outputs.partial }}
        run: |
          if [[ "$PARTIAL" != "false" ]]; then
            echo "A execução parcial não autoriza merge ou release."
            exit 1
          fi
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "A matriz completa não passou."
            exit 1
          fi
